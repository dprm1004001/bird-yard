<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="하얀 빈 마당에서 열매를 흔들어 하찮은 저폴리 새들을 불러 모으고 도감을 채우는 게임">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>베리 마당</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
/* Layout: the whole screen is the white void (the game world); HUD floats in the corners, sheets slide over it.
   Deliberately single-theme: the empty white space is the premise of the game. */
:root{
  --void:#f7f7f4; --ink:#2b2a27; --muted:#8a867e; --line:#e4e1d9; --card:#ffffff;
  --berry:#d23a4f; --leaf:#4e8a4a; --gold:#e3a72f; --feather:#ffcf33;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#world{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#world.over-tree{cursor:pointer}

.hud{position:fixed;z-index:5;display:flex;gap:8px;align-items:center}
.hud.tl{top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));flex-direction:column;align-items:flex-start;gap:2px}
.hud.tr{top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));flex-direction:column;align-items:flex-end}
.hud.bottom{bottom:calc(16px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  flex-direction:column;align-items:stretch;gap:10px;pointer-events:none}
.brow{display:flex;gap:8px;flex-wrap:wrap}
.brow > *{pointer-events:auto}
.brow:not(:has(:not([hidden]))){display:none}
.nav-row{justify-content:space-between}
.menu{justify-content:center;flex-wrap:nowrap}
/* narrow screens: keep the four menu buttons on one row, sharing the width */
@media (max-width:560px){
  .menu{gap:6px}
  .menu .pill{flex:1 1 0;min-width:0;justify-content:center;gap:3px;white-space:nowrap;
    font-size:clamp(12px,3.6vw,15px);padding:7px clamp(4px,1.6vw,10px)}
}
.group{display:flex;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:26px;line-height:1.1;margin:0;font-weight:400}
.stats{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{font:inherit;font-family:var(--display);font-size:16px;display:inline-flex;gap:6px;align-items:center;
  padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;
  box-shadow:0 2px 0 var(--line)}
.pill b{font-weight:400;color:var(--berry);font-variant-numeric:tabular-nums}
/* a red dot on 상점 while a newly unlocked hidden object waits there */
.pill.ping::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--berry);box-shadow:0 0 0 3px rgba(210,58,79,.2);animation:ping 1.2s ease-in-out infinite}
@keyframes ping{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion: reduce){.pill.ping::after{animation:none}}
.pill:active{transform:translateY(1px);box-shadow:none}
.pill:focus-visible,.x:focus-visible,.ghost:focus-visible,.cam:focus-visible,.go:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
.feathers{cursor:default;font-size:18px;padding:7px 14px}
.feathers b{color:var(--ink)}
.feathers.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.12)}}
.orb{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6c2,var(--feather) 55%,#e9a90f);
  box-shadow:0 0 8px 3px rgba(255,207,51,.55);flex:none}
.nav{font:inherit;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;font-size:16px;
  box-shadow:0 2px 0 var(--line);flex:none}
.nav:active{transform:translateY(1px);box-shadow:none}
.nav:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
.cam{display:grid;place-items:center;padding:0}
#soundBtn .snd-off,#soundBtn[aria-pressed="true"] .snd-on{display:none}
#soundBtn[aria-pressed="true"] .snd-off{display:inline}
#soundBtn[aria-pressed="true"]{color:var(--muted)}
/* photo mode */
body.photo .hud,body.photo .hint,body.photo .toasts{display:none!important}
.photo-ui{position:fixed;inset:0;z-index:6;pointer-events:none}
.photo-ui[hidden],.photo-thumb[hidden]{display:none}
.photo-ui > *{pointer-events:auto}
.photo-x{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:22px;line-height:1}
.photo-help{position:absolute;top:calc(20px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:76px;margin:0;
  font-size:12px;color:var(--muted);pointer-events:none}
body[data-place="forest"] .photo-help,body[data-place="island"] .photo-help{color:#f1ecf2;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.shutter{position:absolute;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:68px;height:68px;border-radius:50%;
  border:4px solid #fff;background:rgba(43,42,39,.18);box-shadow:0 0 0 2px rgba(43,42,39,.35),0 2px 10px rgba(0,0,0,.25);cursor:pointer;padding:0;display:grid;place-items:center}
.shutter i{width:50px;height:50px;border-radius:50%;background:#fff;transition:transform .12s}
.shutter:active i{transform:scale(.88)}
.shutter:focus-visible{outline:2px solid var(--berry);outline-offset:3px}
.photo-thumb{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));width:72px;border-radius:8px;
  border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:opacity .4s}
.photo-flash{position:fixed;inset:0;z-index:7;background:#fff;opacity:0;pointer-events:none;transition:opacity .35s}
.photo-flash.on{opacity:.85;transition:none}
/* the dark forest: HUD text sitting directly on the scene turns light */
/* dusk over the dark forest: muted dark purple, with a faint orange glow behind the treeline (the upper middle of the screen) */
body[data-place="forest"]{background:linear-gradient(180deg,#272130 0%,#3b3146 16%,#634756 30%,#80594b 42%,#5a4250 56%,#342c3c 75%,#2a2432 100%)}
body[data-place="forest"] .brand{color:#efe6ef}
body[data-place="forest"] .stats,body[data-place="forest"] .hint{color:#bcaebf}
/* the island sits in a blue sea, so its HUD text turns light too */
body[data-place="island"] .brand{color:#f4fbfc}
body[data-place="island"] .stats{color:#e3f3f6}
.clean{background:#efece5;border-color:#d4cfc4}
.clean[hidden]{display:none!important}

.hint{position:fixed;z-index:4;left:50%;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  font-size:15px;color:var(--muted);text-align:center;width:max-content;max-width:calc(100% - 32px);transition:opacity .5s}
.hint.gone{opacity:0}

.toasts{position:fixed;z-index:8;top:calc(70px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none;width:min(360px,calc(100% - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;text-align:center;animation:pop .35s ease-out}
.toast strong{display:block;font-family:var(--display);font-weight:400;font-size:17px}
.toast span{font-size:13px;opacity:.8}
.toast.new strong{color:#ffd56a}
@keyframes pop{from{transform:translateY(-8px) scale(.96);opacity:0}}

.layer{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.flyorb{position:absolute;left:0;top:0;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff6c2,var(--feather) 55%,#e9a90f);box-shadow:0 0 10px 4px rgba(255,207,51,.6);
  transition:transform .55s cubic-bezier(.5,-.3,.7,1),opacity .55s}

.sheet{position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--card);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .28s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.open{transform:none}
@media (max-width:600px){
  .sheet{top:auto;left:0;width:auto;height:72%;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(102%);
    padding-left:env(safe-area-inset-left,0px)}
}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.sheet h2{font-family:var(--display);font-weight:400;font-size:22px;margin:0}
.sheet .sub{color:var(--muted);font-size:13px;padding:0 16px 10px}
.x{font:inherit;font-size:20px;line-height:1;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;color:var(--ink)}
.scroll{overflow-y:auto;padding:4px 16px 20px;flex:1}

.dexsec{font-family:var(--display);font-size:15px;color:var(--muted);margin:14px 0 8px}
.dexsec:first-child{margin-top:0}
.dex{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:4px;justify-items:center;text-align:center;background:var(--void)}
.card img{width:100%;max-width:150px;aspect-ratio:1;object-fit:contain;border-radius:50%;background:radial-gradient(circle at 50% 55%,#e6e3db,rgba(230,227,219,0) 70%)}
.card.locked img{filter:brightness(0);opacity:.18}
.card .no{font-size:11px;color:var(--muted);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.card .nm{font-family:var(--display);font-size:18px}
.card .meta{font-size:12px;color:var(--muted);min-height:2.6em}
.card .note{font-size:12px;color:var(--ink);font-style:italic;margin:2px 0}

.list{display:grid;gap:10px}
.row{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:6px;background:var(--void)}
.row.done{background:#fbf6e8;border-color:#ecd9a6}
.row .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.row .nm{font-family:var(--display);font-size:17px}
.row .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .ds{font-size:13px}
.row .rw{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:3px}
.row.done .bar i{background:var(--gold)}
.row.here{border-color:var(--ink)}
.go{font:inherit;font-family:var(--display);font-size:15px;justify-self:start;display:inline-flex;gap:6px;align-items:center;
  padding:7px 14px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
.go.light{background:var(--card);color:var(--ink)}
.go:disabled{opacity:.45;cursor:not-allowed}
.reset{margin-top:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.ghost{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.ghost.danger{border-color:var(--berry);color:var(--berry)}
.qmark{font:inherit;font-family:var(--display);font-size:15px;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--muted);
  background:var(--card);color:var(--muted);cursor:pointer;line-height:1;padding:0}
.qmark:focus-visible,.code:focus-visible{outline:2px solid var(--berry);outline-offset:2px}
.code{font:inherit;font-size:16px;letter-spacing:.3em;width:120px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
@media (prefers-reduced-motion: reduce){.sheet,.hint{transition:none}.toast,.feathers.bump{animation:none}}

/* title screen: the logo fades up out of the white void, then the start button */
.title{position:fixed;inset:0;z-index:50;background:var(--void);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:opacity .6s ease}
.title.leaving{opacity:0;pointer-events:none}
.logo{font-family:var(--display);font-weight:400;font-size:clamp(44px,12vw,84px);letter-spacing:.02em;margin:0;color:var(--ink);
  opacity:0;transform:translateY(10px);animation:logoIn 1.8s ease-out .2s forwards}
.logo span{color:var(--berry)}
@keyframes logoIn{to{opacity:1;transform:none}}
.title-actions{display:grid;justify-items:center;gap:14px;opacity:0;animation:logoIn .8s ease-out 1.6s forwards}
.start{font:inherit;font-family:var(--display);font-size:20px;padding:12px 40px;border-radius:999px;border:0;background:var(--ink);color:#fff;cursor:pointer;
  box-shadow:0 3px 0 rgba(0,0,0,.18)}
.start:active{transform:translateY(2px);box-shadow:none}
.start:focus-visible,.restart:focus-visible,.warn button:focus-visible{outline:2px solid var(--berry);outline-offset:3px}
.restart{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;padding:2px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.warn-back{position:fixed;inset:0;z-index:60;background:rgba(43,42,39,.35);display:flex;align-items:center;justify-content:center;padding:16px}
.warn-back[hidden]{display:none!important}
.warn{background:#fff3f2;border:1.5px solid #f0a9a3;border-radius:16px;padding:22px 22px 18px;max-width:340px;width:100%;display:grid;gap:10px;
  box-shadow:0 10px 30px rgba(120,30,30,.18);animation:pop .25s ease-out}
.warn h2{margin:0;font-family:var(--display);font-weight:400;font-size:20px;color:#c23a3a}
.warn p{margin:0;font-size:14px;color:#6b3a36;line-height:1.55}
.warn .row2{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.warn button{font:inherit;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;border:1px solid #e3c2bf;background:#fff;color:var(--ink)}
.warn button.danger{background:#d64545;border-color:#d64545;color:#fff}
@media (prefers-reduced-motion: reduce){.logo,.title-actions{animation:none;opacity:1;transform:none}.title{transition:none}}
/* easter egg: a little 3D stage behind the logo where tapped grain falls and birds drop in to eat it */
.title-fx{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.logo,.title-actions{position:relative;z-index:1}
.logo{pointer-events:none}
</style>
</head>
<body>
<canvas id="world" aria-label="새들이 찾아오는 하얀 마당"></canvas>

<!-- title screen; first visit shows 시작하기, later visits 이어하기 plus a quiet reset link -->
<div class="title" id="title">
  <h1 class="logo">Bird <span>Yard</span></h1>
  <div class="title-actions">
    <button class="start" id="startBtn">시작하기</button>
    <button class="restart" id="restartLink" hidden>처음부터 다시하기</button>
  </div>
</div>
<div class="warn-back" id="warnBack" hidden>
  <div class="warn" role="alertdialog" aria-labelledby="warnTitle" aria-describedby="warnText">
    <h2 id="warnTitle">정말 초기화하시겠습니까?</h2>
    <p id="warnText">도감, 업적 등 모든 데이터가 사라지게 됩니다.</p>
    <div class="row2">
      <button id="warnCancel">취소</button>
      <button class="danger" id="warnOk">초기화</button>
    </div>
  </div>
</div>
<div class="layer" id="layer"></div>

<div class="hud tl">
  <h1 class="brand" id="placeName">베리 마당</h1>
  <div class="stats" id="stats"></div>
</div>
<div class="hud tr">
  <div class="pill feathers" id="featherPill" aria-label="깃털"><span class="orb"></span><b id="featherCount">0</b></div>
  <button class="nav cam" id="photoBtn" aria-label="포토 모드" title="포토 모드">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 8h3l1.6-2.4h6.8L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>
  </button>
  <button class="nav cam" id="soundBtn" aria-label="소리 끄기" aria-pressed="false" title="소리 끄기">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">
      <path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/>
      <g class="snd-on"><path d="M15 9.5a3.5 3.5 0 0 1 0 5"/><path d="M17.5 7.5a6.5 6.5 0 0 1 0 9"/></g>
      <g class="snd-off"><path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/></g></svg>
  </button>
</div>
<!-- photo mode: everything else hides; a shutter, a close button and a short how-to -->
<div class="photo-ui" id="photoUI" hidden>
  <button class="nav photo-x" id="photoClose" aria-label="포토 모드 나가기">×</button>
  <p class="photo-help" id="photoHelp">드래그로 돌려 보기 · 휠·두 손가락으로 확대 · 휠 누른 채·두 손가락으로 끌어 위치 옮기기</p>
  <button class="shutter" id="shutter" aria-label="사진 찍기"><i></i></button>
  <img class="photo-thumb" id="photoThumb" alt="방금 찍은 사진" hidden>
</div>
<div class="photo-flash" id="photoFlash"></div>
<!-- bottom stack, top to bottom: clean-up, place arrows, menu -->
<div class="hud bottom">
  <div class="brow"><button class="pill clean" id="cleanBtn" hidden>똥 치우기</button></div>
  <div class="brow nav-row">
    <button class="nav" id="prevPlace" aria-label="이전 장소">◀</button>
    <button class="nav" id="nextPlace" aria-label="다음 장소">▶</button>
  </div>
  <div class="brow menu">
    <button class="pill" id="openPlace">장소</button>
    <button class="pill" id="openShop">상점</button>
    <button class="pill" id="openDex">도감 <b id="dexCount">0/8</b></button>
    <button class="pill" id="openAch">업적 <b id="achCount">0/5</b></button>
  </div>
</div>
<p class="hint" id="hint"></p>
<div class="toasts" id="toasts"></div>

<aside class="sheet" id="placeSheet" aria-label="장소">
  <header><h2>장소</h2><button class="x" data-close aria-label="닫기">×</button></header>
  <div class="sub">깃털을 모아 새로운 장소를 열어요. 장소마다 찾아오는 새가 달라요.</div>
  <div class="scroll"><div class="list" id="places"></div></div>
</aside>
<aside class="sheet" id="shopSheet" aria-label="상점">
  <header><h2>상점</h2><button class="x" data-close aria-label="닫기">×</button></header>
  <div class="sub">깃털로 산 아이템은 지금 있는 장소에 놓여요. 장소마다 하나씩 놓을 수 있어요.</div>
  <div class="scroll"><div class="list" id="shop"></div></div>
</aside>
<aside class="sheet" id="dexSheet" aria-label="도감">
  <header><h2>새 도감</h2><button class="x" data-close aria-label="닫기">×</button></header>
  <div class="sub">내려앉은 새는 여기에 기록돼요.</div>
  <div class="scroll" id="dex"></div>
</aside>
<aside class="sheet" id="achSheet" aria-label="업적">
  <header><h2>업적</h2><button class="x" data-close aria-label="닫기">×</button></header>
  <div class="sub">업적을 달성하면 베리 마당이 넓어지고, 새로운 새가 찾아와요.</div>
  <div class="scroll">
    <div class="list" id="ach"></div>
    <div class="reset" id="reset"></div>
  </div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ======================================================================
//  Species. Two shared mesh templates (small / large). Within a template
//  every species reuses the same geometry buffers; only the 9-colour
//  palette differs, plus a few part variants for the large birds.

const mat = new THREE.MeshStandardMaterial({vertexColors:true, flatShading:true, roughness:.92, metalness:0});

const h3 = (x,y,z,s) => frac(Math.sin(Math.round(x*500)*12.9898 + Math.round(y*500)*78.233 + Math.round(z*500)*37.719 + s*4.581)*43758.5453);

// positions only: un-index, nudge vertices (hashed by position, so seams stay shut), face normals
function shape(geo, jit = 0, seed = 0){
  if (geo.index) geo = geo.toNonIndexed();
  const pos = geo.attributes.position;
  if (jit > 0) for (let j = 0; j < pos.count; j++){
    const x = pos.getX(j), y = pos.getY(j), z = pos.getZ(j);
    pos.setXYZ(j, x + (h3(x,y,z,seed)-.5)*jit, y + (h3(x,y,z,seed+1)-.5)*jit, z + (h3(x,y,z,seed+2)-.5)*jit);
  }
  geo.computeVertexNormals();
  return geo;
}
function merge(geos){
  const arrs = geos.map(g => (g.index ? g.toNonIndexed() : g).attributes.position.array);
  const out = new Float32Array(arrs.reduce((n, a) => n + a.length, 0));
  let o = 0; for (const a of arrs){ out.set(a, o); o += a.length; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(out, 3)); g.computeVertexNormals();
  return g;
}
// a "skin" shares the template's position + normal buffers and only adds its own colour buffer
function skin(base, paint, salt = 0){
  const pos = base.attributes.position, n = pos.count, cols = new Float32Array(n*3), c = new THREE.Color();
  for (let i = 0; i < n; i += 3){
    const f = 1 + (rnd(salt*31 + i) - .5)*.14;
    for (let k = 0; k < 3; k++){
      const j = i + k; paint(c, pos.getX(j), pos.getY(j), pos.getZ(j), i/3);
      cols[j*3] = Math.min(1, c.r*f); cols[j*3+1] = Math.min(1, c.g*f); cols[j*3+2] = Math.min(1, c.b*f);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', pos); g.setAttribute('normal', base.attributes.normal);
  g.setAttribute('color', new THREE.BufferAttribute(cols, 3));
  return g;
}

// spoon bill (넓적부리도요): a flat shaft that pinches in, then flares into a spatula whose end is
// split into three facets (left lobe, middle, right lobe) meeting at a raised centre point.
// Unit length along +z like the other beaks; r is the cone beak's base radius.
function spoonBeak(r){
  const a = r*.85, h = r*.5;
  // outline seen from above, clockwise from the left base corner: [x, z]
  const O = [[-a,0],[-.42*a,.55],[-1.9*a,.8],[-1.05*a,1],[1.05*a,1],[1.9*a,.8],[.42*a,.55],[a,0]];
  const top = O.map(([x, z]) => [x, h/2, z]), bot = O.map(([x, z]) => [x, -h/2, z]);
  const C = [0, h*.95, .8];          // raised centre of the spatula: makes the tip read as three facets
  const tris = [];
  const t = (p, q, s) => tris.push(p, q, s);
  // top: shaft quad, then the spatula fanned round the centre point
  t(top[0], top[1], top[6]); t(top[0], top[6], top[7]);
  t(top[1], top[2], C); t(top[2], top[3], C); t(top[3], top[4], C); t(top[4], top[5], C); t(top[5], top[6], C); t(top[6], top[1], C);
  // bottom: one flat fan
  const bc = [0, -h/2, .6];
  for (let i = 0; i < O.length; i++) t(bot[i], bot[(i + 1) % O.length], bc);
  // sides
  for (let i = 0; i < O.length; i++){ const j = (i + 1) % O.length; t(top[i], bot[i], bot[j]); t(top[i], bot[j], top[j]); }
  // wind every triangle outward (away from the bill's middle) so none get culled
  const pos = [], m = new THREE.Vector3(0, 0, .55), A = new THREE.Vector3(), B = new THREE.Vector3(), D = new THREE.Vector3(), n = new THREE.Vector3();
  for (let i = 0; i < tris.length; i += 3){
    A.fromArray(tris[i]); B.fromArray(tris[i + 1]); D.fromArray(tris[i + 2]);
    n.subVectors(B, A).cross(D.clone().sub(A));
    const c = A.clone().add(B).add(D).multiplyScalar(1/3).sub(m);
    if (n.dot(c) < 0) pos.push(...tris[i], ...tris[i + 2], ...tris[i + 1]);
    else pos.push(...tris[i], ...tris[i + 1], ...tris[i + 2]);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals();
  return g;
}

      const u = y/H;
      c.copy(C.body).lerp(C.breast, ss(-R*.05, R*.45, z) * ss(.15, .5, u));
      c.lerp(C.neck, ss(.7, .93, u) * (round ? .6 : 1));
      if (z < -R*.1) c.lerp(C.wing, sp.backTint * ss(-R*.1, -R*.5, z) * (round ? 1 : 1 - ss(.7, .9, u)));
      // chunky barring across the breast: every other ring of faces gets darker
      if (sp.bars && z > -R*.2 && u > .12 && u < .78 && Math.floor(f/2) % rings % 2) c.lerp(C.wingTip, .4);
      if (u < .12) c.multiplyScalar(.85);
    }, 1),
    head: skin(hd.geo, (c,x,y,z) => {
      const u = y/hh;
      c.copy(C.neck).lerp(C.head, ss(cap, cap + .33, u));

    beak:  skin(P.beak[sp.beak || 'cone'], (c,x,y,z) => {
      // tipFrom: a hard-edged dark tip (flamingo) instead of the usual gradual darkening
      c.copy(C.beak).lerp(beakDark, sp.tipFrom ? +(z > sp.tipFrom) : ss(.3, 1, z));
      if (sp.pouchColor && y < -hr*.04) c.set(sp.pouchColor);  // pelican throat pouch
    }, 3),
    neckTube: sp.neckLen ? skin(P.neckTube, (c,x,y,z) => c.copy(C.neck).lerp(C.face, ss(0, hr*.5, z)*.6), 7) : null,
    ear:   sp.ears ? skin(P.ear, c => c.copy(C.head), 8) : null,
    plume: sp.plume ? skin(P.plume, c => c.copy(C.head), 8) : null,
    eye:   skin(P.eye, c => c.set(sp.eye), 4),
    pupil: sp.pupil ? skin(P.pupil, c => c.set('#0d0d10'), 5) : null,
    wing:  sp.batWing ? skin(P.batWing, (c,x,y) => c.copy(C.wing).lerp(C.wingTip, ss(.2, 1, -y/L)), 6) : skin(P.wing, (c,x,y,z,f) => {
      const v = -y/L;
      c.copy(C.wing).lerp(C.wingTip, ss(.45, .95, v));
      if (sp.stripes && v > .6){ const q = Math.floor(f/2); c.copy((Math.floor(q/3) + q%3) % 2 ? C.wingTip : white); }
    }, 6),
    // tailBand: a plain white tail; buildBird wraps a black band round it
    tail:  skin(P.tail, (c,x,y,z) => sp.tailBand ? c.copy(C.body) : c.copy(C.wing).lerp(C.wingTip, ss(.3, 1, -z/tl)), 9),
    band:  sp.tailBand ? solid(new THREE.CylinderGeometry(t.R*.38*.25*1.15, t.R*.38*.55*1.15, tl*.3, 4).rotateX(-Math.PI/2)
                                 .translate(0, 0, -tl*.6).scale(1.25, .35*1.2, 1), sp.colors.wingTip, 11) : null,
    leg:   skin(P.leg, c => c.copy(C.legs), 10),
    feet:  skin(sp.feet === 'web' ? P.web : P.toes, (c,x,y,z) => c.copy(footC), 12),
  };
}

function buildBird(id){
  const sp = SPECIES[id], t = TPL[sp.tpl], G = skinsFor(id), {H, R, hr, bottom} = t;
  const hd = t.heads[sp.head || 'round'], legLen = sp.legLen || t.legLen;
  const root = new THREE.Group();
  const body = new THREE.Group(); body.scale.setScalar(BIRD_SCALE*(SIZE[id] || 1)); root.add(body);
  const hips = new THREE.Group(); hips.position.y = legLen; body.add(hips);
  const torso = new THREE.Group(); torso.rotation.x = sp.lean; if (sp.scale) torso.scale.set(...sp.scale); hips.add(torso);
  const b = mesh(G.body); b.position.y = bottom; torso.add(b);
  const neck = new THREE.Group(); neck.position.y = bottom + H*.95; neck.rotation.x = -sp.lean*.8; torso.add(neck);
  if (G.neckTube){ const tube = mesh(G.neckTube); tube.scale.y = sp.neckLen; neck.add(tube); }
  const head = new THREE.Group(); head.position.y = sp.neckLen || 0; head.scale.setScalar(sp.headScale || 1); neck.add(head);
  head.add(mesh(G.head));
  const beak = mesh(G.beak); beak.position.set(0, hd.hh*hd.beakY, hr*.8); beak.scale.z = sp.beakLen || .07; beak.rotation.x = sp.beakTilt || 0; head.add(beak);
  if (G.ear) for (const s of [-1, 1]){ const e = mesh(G.ear); e.position.set(s*hr*.55, hd.hh*.78, -hr*.05); e.rotation.z = -s*.35; head.add(e); }
  if (G.plume){ const p = mesh(G.plume); p.position.set(0, hd.hh*.62, -hr*.7); p.rotation.x = .35; head.add(p); }
  for (const s of [-1, 1]){
    const e = new THREE.Group(), a = sp.eyeAngle || .95;
    e.position.set(s*Math.sin(a)*hr*.86, hd.hh*.56, Math.cos(a)*hr*.86); e.rotation.y = s*a; e.scale.setScalar(sp.eyeScale || 1); head.add(e);
    e.add(mesh(G.eye));
    if (G.pupil){ const p = mesh(G.pupil); p.position.z = hr*.06; e.add(p); }
  }
  const wings = [-1, 1].map(s => {
    const w = mesh(G.wing); w.position.set(s*R*.8, bottom + H*.7, -R*.18); w.rotation.set(.34, 0, s*.03); torso.add(w); return w;
  });
  const tail = mesh(G.tail); tail.position.set(0, bottom + H*.2, -R*.7); tail.rotation.x = sp.tailUp; tail.scale.z = sp.tailLen || 1; torso.add(tail);
  if (G.band) tail.add(mesh(G.band));
  const k = legLen/t.legLen;
  const legs = [-1, 1].map(s => {
    const lg = new THREE.Group(); lg.position.set(s*R*.32, 0, R*.05); hips.add(lg);
    const leg = mesh(G.leg); leg.scale.y = k; lg.add(leg);
    const feet = mesh(G.feet); feet.position.y = -legLen; lg.add(feet);
    return lg;
  });
  return {root, hips, torso, neck, head, wings, legs, sp, id, large:sp.tpl === 'large'};
}

function addObstacle(rt, x, z, r, extra){ rt.obstacles.push({x, z, r, extra:!!extra}); }
function pushOut(rt, p, pad){
  for (const o of rt.obstacles){
    let dx = p.x - o.x, dz = p.z - o.z, d = Math.hypot(dx, dz);
    const m = o.r + pad;
    if (d >= m) continue;

    p.x = o.x + dx/d*m; p.z = o.z + dz/d*m;
  }
}

function makeSource(rt, {x, z, s = 1, food, throwH, throwUp, build, slotPos}){
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
  const src = {rt, group:g, slots:[], shake:0, energy:0, hit:[], s, food, throwH, throwUp};

const rippleMat = new THREE.MeshBasicMaterial({map:null, color:0xffffff, transparent:true, opacity:.5, depthWrite:false});

const SCRUB_R = .55;  // radius one scrub clears around its target stain
function updateCleaner(rt, dt){
  const C = rt.cleaner; if (!C) return;
  if (C.dance > 0){ C.dance -= dt; applyPose(C); return; }
  const r = C.b.root, reach = .3*BK;
  if (C.state === 'idle'){
    // starts a round once six or more stains have piled up
    if (rt.poops.length >= 6 && rt.cleaning < 0) C.state = 'work';
    else {
      const dx = C.home.x - r.position.x, dz = C.home.z - r.position.z;
      if (Math.hypot(dx, dz) > .05){
        faceTo(C, Math.atan2(dx, dz), dt); stepToward(C, C.home.x, C.home.z, dt);
        // can't get home past something: just settle where it is
        C.homeT = (C.homeT || 0) + dt;
        if (C.homeT > 4){ C.home = {x:r.position.x, z:r.position.z}; C.homeT = 0; }
      }
      else if ((C.lookT -= dt) < 0){ C.lookT = 1 + Math.random()*2; C.headGoal = (Math.random() - .5)*1.4; }
    }
  } else if (C.state === 'work'){
    if (!rt.poops.length || rt.cleaning >= 0){
      if (!rt.poops.length) toast('청소부가 다 치웠어요', `${PLACES[rt.id].name} 바닥이 반짝반짝해요`);
      C.state = 'idle'; C.target = null;
    } else {
      if (!C.target || !rt.poops.includes(C.target)){
        let bd = 1e9;
        for (const m of rt.poops){ const d = m.position.distanceToSquared(r.position); if (d < bd){ bd = d; C.target = m; } }
        C.walkT = 0;
      }
      const p = C.target.position, dx = p.x - r.position.x, dz = p.z - r.position.z, d = Math.hypot(dx, dz);
      faceTo(C, Math.atan2(dx, dz), dt); C.headGoal = 0;
      C.walkT += dt;
      // if something blocks the way for a while, scrub from where it stands rather than pacing forever
      if ((d < reach + .03 || C.walkT > 3) && !C.hop){
        // one scrub wipes every stain within a wide circle around the target
        C.state = 'scrub'; C.t = 0;
        C.batch = rt.poops.filter(m => m.position.distanceTo(p) < SCRUB_R);
      }
      else stepToward(C, p.x - dx/d*reach, p.z - dz/d*reach, dt);
    }
  } else if (C.state === 'scrub'){
    C.t += dt; C.peck = Math.abs(Math.sin(C.t*Math.PI*3));
    const batch = C.batch.filter(m => rt.poops.includes(m));
    if (!batch.length){ C.peck = 0; C.state = 'work'; C.target = null; }
    else {
      for (const m of batch) m.scale.copy(m.userData.s).multiplyScalar(Math.max(.001, 1 - C.t/1.1));
      if (C.t >= 1.1){
        for (const m of batch) rt.group.remove(m);
        rt.poops = rt.poops.filter(x => !batch.includes(x));
        S.dirt[rt.id] = rt.poops.length ? Math.max(0, dirtOf(rt.id) - .03*batch.length) : 0;
        save(); updateHUD(); C.peck = 0; C.state = 'work'; C.target = null;
      }
    }
  }
  pushOut(rt, r.position, .16*BK);
  C.headYaw += (C.headGoal - C.headYaw)*Math.min(1, dt*8);
  applyPose(C);
}

function updateShow(rt, dt){

  sh.t += dt;

  if (sh.t < SHOW.prep){
    // the glow turns red, the stem sinks into the pumpkin and the siren rises out of the top
    const k = ss(0, SHOW.prep, sh.t);
    glow.copy(glowYellow).lerp(glowRed, ss(0, .5, sh.t));
    H.stem.position.y = -.16*k; H.stem.visible = k < .95;
    H.siren.position.y = h - .25 + .2*ss(.3, SHOW.prep, sh.t);
  } else {
    if (!sh.music){ sh.music = true; showMusic.currentTime = 0; showMusic.muted = muted; showMusic.play().catch(() => {}); }  // muted, it still plays silently to keep the beat clock
    const m = showClock(sh);

      H.siren.rotation.y += dt*(3 + m*2.2);
      glow.copy(glowRed).multiplyScalar(.55 + .45*Math.abs(Math.sin(m*Math.PI*1.6)));

      }
    } else {

      if (!sh.outT){ sh.outT = sh.t; danceSync = null; }

}

function updateDrops(rt, dt){
  if (!rt.drops?.length) return;
  // a landing fish splashes again mid-update: those new drops go into a fresh list and are kept below
  const current = rt.drops; rt.drops = [];
  const kept = current.filter(d => {
    d.t += dt;
    if (d.kind === 'drop'){
      d.v.y -= 9.8*dt; d.m.position.addScaledVector(d.v, dt);
      if (d.t > .1 && d.m.position.y < d.y0){ rt.group.remove(d.m); return false; }
    } else if (d.kind === 'ring'){

      if (d.t >= .7){ rt.group.remove(d.m); d.m.material.dispose(); return false; }
    } else {
      // the fish arcs up out of the water, nose up then nose down, wriggling, and plops back in
      const u = Math.min(1, d.t/d.dur);
      d.m.position.lerpVectors(d.from, d.to, u); d.m.position.y = d.from.y + d.h*4*u*(1 - u);

      if (u >= 1){ rt.group.remove(d.m); splash(rt, d.to, .7); return false; }
    }

    return true;

    const d = Math.hypot(p.x, p.z); if (d > lim){ p.x *= lim/d; p.z *= lim/d; b.v.x *= -.4; b.v.z *= -.4; }

canvas.addEventListener('pointermove', e => {
  if (photo) return photoMove(e);

  drag.lastX = e.clientX; drag.lastY = e.clientY; drag.moved += Math.abs(dx) + Math.abs(dy);
  if (drag.orbit){ camGoal -= dx*.006; return; }
  if (drag.src){
    const t = drag.src;
    t.shake = Math.min(1.6, t.shake + Math.abs(dx)*.012);
    t.energy += Math.abs(dx)*.012;
    while (t.energy >= 1){ t.energy -= 1; dropFood(t); }
  } else if (drag.sweep){
    // sample along the stroke so fast swipes still catch feathers
    const n = Math.ceil(Math.hypot(dx, dy)/12);

const endDrag = () => {

      const t = drag.src; t.shake = Math.min(1.6, t.shake + .7);

// ======================================================================
//  Photo mode: free camera (turn, tilt, zoom, slide) and a shutter that saves a PNG.
//  One finger / left drag turns and tilts; wheel or pinch zooms; a held-wheel (middle) drag or two fingers slide the view
// ======================================================================
let photo = null;
const LOOK0 = new THREE.Vector3(0, .55, 0);
function enterPhoto(){
  if (photo) return;
  drag = null;
  photo = {dist:camD*1.118, pitch:Math.atan2(.5, 1), pan:new THREE.Vector3(), pts:new Map(), last:null};
  document.body.classList.add('photo'); $('photoUI').hidden = false;
  for (const s of document.querySelectorAll('.sheet')) s.classList.remove('open');
}
function exitPhoto(){
  if (!photo) return;
  photo = null;
  document.body.classList.remove('photo'); $('photoUI').hidden = true; $('photoThumb').hidden = true;
}
// where the camera sits: in photo mode from its own orbit, otherwise the usual fixed tilt round the middle of the place
function placeCamera(){
  const portrait = innerWidth/innerHeight < 1 ? Math.pow(innerHeight/innerWidth, .55) : 1;
  if (photo){
    const D = photo.dist*portrait, c = Math.cos(photo.pitch), tgt = v3.copy(LOOK0).add(photo.pan);
    camera.position.set(tgt.x + Math.sin(camA)*c*D, tgt.y + Math.sin(photo.pitch)*D, tgt.z + Math.cos(camA)*c*D);
    camera.lookAt(tgt);
  } else {
    const D = camD*portrait;
    camera.position.set(Math.sin(camA)*D, D*.5, Math.cos(camA)*D);
    camera.lookAt(LOOK0);
  }
}
// slide the view along the screen: right/left and up/down, scaled so the scene keeps pace with the finger
function photoPan(dx, dy){
  const k = photo.dist*Math.tan(camera.fov*Math.PI/360)*2/innerHeight;
  const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0), up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
  photo.pan.addScaledVector(right, -dx*k).addScaledVector(up, dy*k);
  photo.pan.y = Math.max(-.5, Math.min(3, photo.pan.y));
  photo.pan.clampLength(0, 8);
}
function photoDown(e){
  photo.pts.set(e.pointerId, {x:e.clientX, y:e.clientY, mid:e.button === 1});
  photo.last = null;
}
function photoMove(e){
  const pts = photo.pts, p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  if (pts.size >= 2){
    // two fingers: the gap between them zooms, their midpoint slides the view
    const [a, b] = [...pts.values()], before = {gap:Math.hypot(a.x - b.x, a.y - b.y), mx:(a.x + b.x)/2, my:(a.y + b.y)/2};
    p.x = e.clientX; p.y = e.clientY;
    const gap = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x)/2, my = (a.y + b.y)/2;
    if (before.gap > 10 && gap > 10) photo.dist = Math.min(14, Math.max(.8, photo.dist*before.gap/gap));
    photoPan(mx - before.mx, my - before.my);
    return;
  }
  p.x = e.clientX; p.y = e.clientY;
  if (p.mid) photoPan(dx, dy);                       // held wheel: slide
  else {                                            // one finger / left button: turn and tilt
    camGoal -= dx*.006; camA = camGoal;
    photo.pitch = Math.min(1.45, Math.max(-.05, photo.pitch + dy*.005));
  }
}
function photoUp(e){ photo.pts.delete(e.pointerId); }
canvas.addEventListener('auxclick', e => { if (photo) e.preventDefault(); });

// the shutter: draw the scene over its own background (the forest's dusk sky is CSS behind the canvas) and save it
const DUSK_STOPS = [[0,'#272130'],[.16,'#3b3146'],[.3,'#634756'],[.42,'#80594b'],[.56,'#5a4250'],[.75,'#342c3c'],[1,'#2a2432']];
function takePhoto(){
  placeCamera(); renderer.render(scene, camera);
  const src = renderer.domElement, out = document.createElement('canvas'); out.width = src.width; out.height = src.height;
  const c2 = out.getContext('2d'), e = ENV[cur];
  if (e.dusk){ const gr = c2.createLinearGradient(0, 0, 0, out.height); DUSK_STOPS.forEach(([o, h]) => gr.addColorStop(o, h)); c2.fillStyle = gr; }
  else c2.fillStyle = '#' + new THREE.Color(e.bg).getHexString();
  c2.fillRect(0, 0, out.width, out.height);
  c2.drawImage(src, 0, 0);
  const fl = $('photoFlash'); fl.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => fl.classList.remove('on')));
  const d = new Date(), z = n => String(n).padStart(2, '0');
  const name = `bird-yard-${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.png`;
  out.toBlob(async blob => {
    if (!blob) return;
    const url = URL.createObjectURL(blob);
    // inside the claude.ai artifact viewer a plain download is blocked, so ask its downloads capability to save it;
    // anywhere else (GitHub Pages) a normal download link does it
    let dl = null;
    try { dl = window.claude?.use ? await window.claude.use('downloads') : null; } catch {}
    if (dl) dl.save({filename:name, data:blob}).catch(() => {});
    else { const a = document.createElement('a'); a.href = url; a.download = name; document.body.append(a); a.click(); a.remove(); }
    const th = $('photoThumb'); th.src = url; th.hidden = false; th.style.opacity = 1;
    clearTimeout(takePhoto.t); takePhoto.t = setTimeout(() => { th.style.opacity = 0; }, 2200);
  }, 'image/png');
}

function makePortraits(){
  const pr = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});

  const ps = new THREE.Scene();
  ps.add(new THREE.HemisphereLight(0xffffff, 0xd0ccc4, 1));
  const dl = new THREE.DirectionalLight(0xffffff, .6); dl.position.set(2, 3, 3); ps.add(dl);
  const pc = new THREE.PerspectiveCamera(30, 1, .05, 10);
  const box = new THREE.Box3(), size = new THREE.Vector3(), ctr = new THREE.Vector3(), dir = new THREE.Vector3(.55, .38, 1).normalize();
  for (const id of ALL_SPECIES){
    const b = buildBird(id);

    // frame each bird by its own bounds, so herons and wrens both fill the card

    pc.position.copy(ctr).addScaledVector(dir, Math.max(size.x, size.y, size.z)*2.1); pc.lookAt(ctr);
    pr.render(ps, pc); portraits[id] = pr.domElement.toDataURL('image/png'); ps.remove(b.root);

}

function resetPrompt(){
  const box = $('reset'); box.replaceChildren();
  const q = document.createElement('span'); q.textContent = '도감, 업적, 깃털, 장소, 아이템이 모두 지워져요.';
  const yes = document.createElement('button'); yes.className = 'ghost danger'; yes.textContent = '지우기';
  const no = document.createElement('button'); no.className = 'ghost'; no.textContent = '취소';
  yes.onclick = resetAll; no.onclick = resetButton;
  box.append(q, yes, no);
}
function resetAll(){
  S = fresh(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {}
  for (const pid of PLACE_ORDER){
    const rt = RT[pid];
    clearBirds(rt);
    for (const b of [...rt.food]) removeFood(rt, b);
    for (const m of rt.poops) rt.group.remove(m); rt.poops = [];
    for (const f of rt.feathers) rt.group.remove(f.g); rt.feathers = [];
    rt.cleaning = -1;
    for (const k in rt.elements) rt.group.remove(rt.elements[k]);
    for (const k in rt.items) rt.group.remove(rt.items[k].group);
    rt.elements = {}; rt.items = {}; rt.spots = []; rt.cleaner = null; rt.hiddenObj = null; rt.stumpSpots = null; rt.picnic = null; rt.springSpots = null; rt.hut = null;
    if (rt.waterMeshes) rt.waterMeshes = rt.waterMeshes.filter(m => !m.userData.spring);
    rt.specials = rt.specials.filter(s => s.kind !== 'bowl');
    rt.obstacles = rt.obstacles.filter(o => !o.extra);
    rt.sources = rt.sources.filter(s => !s.extra);
  }
  for (const sl of RT.yard.sources[0].slots) if (!sl.item) growFood(RT.yard.sources[0], sl, 1);
  resetButton(); goPlace('yard'); renderAch(); renderDex();
}

// ======================================================================
//  Loop
// ======================================================================
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
const clock = new THREE.Clock();
// ---------- ambient sound per place: a looping bed that fades in while you're there and out when you leave ----------
// Browsers only allow sound after the player's first tap, so nothing plays until then.
const AMBIENT = {yard:{src:'sounds/yard-spring-noon.mp3', vol:.22}, pond:{src:'sounds/pond-spring.mp3', vol:.22}, plaza:{src:'sounds/plaza-town-square.mp3', vol:.22}, island:{src:'sounds/sea-waves.mp3', vol:.22}};
// the speaker button under the camera turns every sound off and on; the choice is remembered on this device
const MUTE_KEY = 'berry-yard-muted';
let muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch {}
function setMuted(m){
  muted = m; showMusic.muted = m;
  try { localStorage.setItem(MUTE_KEY, m ? '1' : '0'); } catch {}
  const b = $('soundBtn'); b.setAttribute('aria-pressed', m); b.setAttribute('aria-label', m ? '소리 켜기' : '소리 끄기'); b.title = b.getAttribute('aria-label');
}
setMuted(muted);
const ambient = {};
let soundOK = false;
addEventListener('pointerdown', () => {
  if (soundOK) return;
  soundOK = true;
  // iPhones only let an audio element play later if it was started inside a tap once: start each one now, silently, and pause it
  for (const pid in AMBIENT){
    const a = ambient[pid] ??= Object.assign(new Audio(AMBIENT[pid].src), {loop:true, volume:0});
    a.play().then(() => { if (a.volume <= .001) a.pause(); }).catch(() => {});
  }
}, {capture:true});
function updateAmbient(dt){
  for (const pid in AMBIENT){
    const want = soundOK && !muted && pid === cur && !document.hidden && !document.getElementById('title') ? AMBIENT[pid].vol : 0;
    let a = ambient[pid];
    if (!a){ if (!want) continue; a = ambient[pid] = new Audio(AMBIENT[pid].src); a.loop = true; a.volume = 0; }
    a.volume = Math.max(0, Math.min(1, a.volume + Math.sign(want - a.volume)*Math.min(Math.abs(want - a.volume), dt*.4)));
    if (want && a.paused) a.play().catch(() => {});
    else if (!want && !a.paused && a.volume <= .001) a.pause();
  }
}
function frame(){
  requestAnimationFrame(frame);
  const dt = Math.min(clock.getDelta(), .05); T0 += dt;
  const rt = P;
  updateAmbient(dt);

  for (const t of rt.sources){
    if (t.auto !== undefined && (t.auto -= dt) <= 0){  // automatic feeder
      t.auto = 5 + Math.random()*3;
      if (freeFood(rt).length < 4 && dropFood(t)) t.shake = .5;
    }
    t.shake *= Math.exp(-dt*3);
    t.group.rotation.z = t.shake*.06*Math.sin(T0*26);
    t.group.rotation.x = t.shake*.04*Math.cos(T0*21);
    for (const sl of t.slots){
      if (!sl.item){ if ((sl.regrow -= dt) <= 0) growFood(t, sl, 0); }
      else if (sl.item.grow < 1){ sl.item.grow = Math.min(1, sl.item.grow + dt*.8); sl.item.mesh.scale.setScalar(Math.max(.001, sl.item.grow)); }
    }
  }
  for (const k in rt.elements){
    const g = rt.elements[k];
    if (g.userData.pop !== undefined && g.userData.pop < 1){
      g.userData.pop = Math.min(1, g.userData.pop + dt*1.6);
      const p = g.userData.pop, s = p < 1 ? 1 + Math.sin(p*Math.PI)*.15 : 1;
      g.scale.setScalar(Math.max(.001, p*s*g.userData.target));
    }
  }
  if (rt.ripples) for (const m of rt.ripples){ m.position.x += m.userData.v*dt; if (m.position.x > 5.5) m.position.x = -5.5; }
  if (rt.foam) rt.foam.forEach((m, i) => { const k = (T0*.3 + i*.5) % 1; m.scale.setScalar(1 + k*.12); m.material.opacity = .55*(1 - k); });
  updateFood(rt, dt);
  updateDirt(rt, dt);
  updateCleaner(rt, dt);
  if (cur === 'yard') yardDecor.update(dt);
  if (cur === 'pond') pondDecor.update(dt);
  if (cur === 'plaza') plazaDecor.update(dt);
  if (cur === 'river') riverDecor.update(dt);
  if (cur === 'forest') forestDecor.update(dt);
  if (cur === 'island') islandDecor.update(dt);
  updateHidden(rt, dt);
  updateDrops(rt, dt);
  updateFeathers(rt, dt);

  // hidden motion: now and then (about once every three minutes with a crowd) everyone breaks into the dance
  if (rt.birds.filter(onGround).length >= 3 && !rt.birds.some(B => B.dance > 0) && Math.random() < dt/180) startDance(rt, 4 + Math.random()*3);
  rt.spawnT -= dt;
  if (rt.spawnT <= 0){
    // resting birds don't count toward the cap, and free perch spots attract birds on their own
    const active = rt.birds.filter(b => !b.restSpot).length, spot = freeSpot(rt);
    if (freeFood(rt).length && active < capFor(rt.id)) spawnBird(rt);
    else if (spot && Math.random() < .45) spawnBird(rt, spot);
    rt.spawnT = (1 + Math.random()*2) * (1 + dirtOf(rt.id)*2);  // a dirty floor scares birds off
  }
  for (const B of [...rt.birds]) updateBird(B, dt);
  const crowd = rt.birds.filter(onGround).length;
  if (crowd > S.maxCrowd){ S.maxCrowd = crowd; save(); checkAch(); updateHUD(); }

  camA += (camGoal - camA)*Math.min(1, dt*6);
  placeCamera();
  // the opaque title screen hides the game, so skip drawing it until the title starts fading out
  const titleEl = document.getElementById('title');
  if (!titleEl || titleEl.classList.contains('leaving')) renderer.render(scene, camera);
}

// ---------- boot ----------
for (const pid of PLACE_ORDER) for (const k of S.items[pid] || []) placeItem(pid, k, false);
rippleMat.map = stainTex; rippleMat.needsUpdate = true;
yardDecor.update(0, true); pondDecor.update(0, true); plazaDecor.update(0, true); riverDecor.update(0, true); forestDecor.update(0, true); islandDecor.update(0, true);
for (const pid in HIDDEN) if (S.hidden[pid]) placeHidden(pid, false);
P.group.visible = true; applyEnv(cur);
resetButton(); makePortraits(); showHint(); updateHUD(); resize(); frame();
for (const pid in HIDDEN) checkHiddenUnlock(pid);  // saves that already qualify get the announcement once

// ---------- title screen ----------
const VISITED_KEY = 'berry-yard-visited';
let visited = false;
try { visited = !!localStorage.getItem(VISITED_KEY) || !!localStorage.getItem(KEY); } catch {}
if (visited){ $('startBtn').textContent = '이어하기'; $('restartLink').hidden = false; }
// easter egg: tap the empty title screen and a grain falls; a bird flies down to peck it up.
// First-time players only meet the robin and the magpie; returning players get birds from their encyclopedia.
const titleFx = (() => {
  const host = $('title'), cv = document.createElement('canvas'); cv.className = 'title-fx'; host.prepend(cv);
  const r = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true});
  r.setPixelRatio(Math.min(devicePixelRatio, 2)); r.shadowMap.enabled = true;
  const sc = new THREE.Scene();
  sc.add(new THREE.HemisphereLight(0xffffff, 0xd8d4cc, .85));
  const sl = new THREE.DirectionalLight(0xffffff, .75); sl.position.set(2, 5, 2.5); sl.castShadow = true;
  Object.assign(sl.shadow.camera, {left:-4, right:4, top:4, bottom:-4}); sc.add(sl);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30).rotateX(-Math.PI/2), new THREE.ShadowMaterial({opacity:.12}));
  floor.receiveShadow = true; sc.add(floor);
  // a distant view: camera pulled well back so the ground, grain and birds all read small
  const cam = new THREE.PerspectiveCamera(26, 1, .05, 80); cam.position.set(0, 4.6, 7.6); cam.lookAt(0, .1, 0);
  const MAX_BIRDS = 10, MAX_SEEDS = 12, BIRD_K = .75, SEED_K = .6;
  const rt = {id:'title', group:new THREE.Group()}; sc.add(rt.group);
  const seen = Object.keys(S.seen || {}).filter(k => SPECIES[k]);
  const pool = visited && seen.length ? seen : ['robin', 'magpie'];
  const seeds = [], visits = [];
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hit = new THREE.Vector3(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
  const size = () => { r.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix(); };
  size(); addEventListener('resize', size);
  host.addEventListener('pointerdown', e => {
    if (e.target.closest('button') || !$('warnBack').hidden) return;
    ndc.set(e.clientX/innerWidth*2 - 1, -(e.clientY/innerHeight)*2 + 1); ray.setFromCamera(ndc, cam);
    // only so much grain at once: extra taps are ignored until some has been eaten
    if (seeds.length >= MAX_SEEDS || !ray.ray.intersectPlane(plane, hit)) return;
    const x = Math.max(-3.4, Math.min(3.4, hit.x)), z = Math.max(-2.6, Math.min(2.2, hit.z));
    const m = mesh(FOOD.seed.geo); m.scale.setScalar(SEED_K); m.position.set(x, 1.2, z); m.rotation.y = Math.random()*6; rt.group.add(m);
    const a = Math.random()*Math.PI*2, sp = .15 + Math.random()*.25;
    const s = {m, vy:0, vx:Math.cos(a)*sp, vz:Math.sin(a)*sp, bounces:1 + (Math.random() < .5), landed:false, claimed:false, wait:.3 + Math.random()*.6}; seeds.push(s);
  });
  function call(s){
    s.claimed = true;
    const id = pool[Math.floor(Math.random()*pool.length)], A = actor(rt, id), p = s.m.position;
    A.b.root.scale.setScalar(BIRD_K);
    const from = skyPoint().multiplyScalar(1.4), dx = from.x - p.x, dz = from.z - p.z, d = Math.hypot(dx, dz);
    const reach = (A.b.large ? .24 : .15)*BK*BIRD_K;
    flyTo(A, from, new THREE.Vector3(p.x + dx/d*reach, 0, p.z + dz/d*reach));
    visits.push({A, s, state:'in', t:0});
  }
  let last = performance.now(), alive = true;
  (function loop(now){
    if (!alive) return;
    requestAnimationFrame(loop);
    const dt = Math.min(.05, (now - last)/1000); last = now;
    for (const s of seeds){
      if (!s.landed){ s.vy -= 9.8*dt; s.m.position.y += s.vy*dt; s.m.rotation.x += dt*6;
        s.m.position.x += s.vx*dt; s.m.position.z += s.vz*dt;
        if (s.m.position.y <= .02){
          s.m.position.y = .02;
          // one or two little hops on the ground before it settles
          if (s.bounces-- > 0){ s.vy = Math.abs(s.vy)*.38; s.vx *= .6; s.vz *= .6; }
          else s.landed = true;
        } }
      // never more than MAX_BIRDS on screen; spare grain waits for a bird to leave
      else if (!s.claimed && (s.wait -= dt) <= 0 && visits.length < MAX_BIRDS) call(s);
    }
    for (const v of [...visits]){
      const A = v.A, p = v.s.m.position;
      if (v.state === 'in'){
        if (flyStep(A, dt, true)){ v.state = 'eat'; A.fly = 0; A.b.root.position.y = 0;
          A.b.root.rotation.y = Math.atan2(p.x - A.b.root.position.x, p.z - A.b.root.position.z); }
      } else if (v.state === 'eat'){
        v.t += dt; A.peck = Math.abs(Math.sin(v.t*Math.PI*2.4));
        if (v.t > .5) v.s.m.scale.setScalar(Math.max(.01, 1 - (v.t - .5)/.75));
        if (v.t >= 1.25){ A.peck = 0; rt.group.remove(v.s.m); seeds.splice(seeds.indexOf(v.s), 1); v.state = 'linger'; v.t = 0; }
      } else if (v.state === 'linger'){
        v.t += dt;
        if (Math.random() < dt*1.5) A.headGoal = (Math.random() - .5)*1.4;
        A.headYaw += (A.headGoal - A.headYaw)*Math.min(1, dt*6);
        if (v.t > 1.6){ v.state = 'out'; flyTo(A, A.b.root.position, skyPoint().multiplyScalar(1.4)); }
      } else if (flyStep(A, dt, false)){ removeActor(A); visits.splice(visits.indexOf(v), 1); continue; }
      applyPose(A);
    }
    r.render(sc, cam);
  })(last);
  return {
    stop(){ alive = false; removeEventListener('resize', size); r.dispose(); r.forceContextLoss?.(); },
    status: () => ({pool, seeds:seeds.length, visits:visits.map(v => v.A.id + ':' + v.state)}),  // for console checks
  };
})();
function closeTitle(){
  try { localStorage.setItem(VISITED_KEY, '1'); } catch {}
  $('title').classList.add('leaving');
  setTimeout(() => { titleFx.stop(); $('title').remove(); }, 650);
}
$('startBtn').onclick = closeTitle;
const openWarn = () => { $('warnBack').hidden = false; $('warnCancel').focus(); };
const closeWarn = () => { $('warnBack').hidden = true; };
$('restartLink').onclick = openWarn;
$('warnCancel').onclick = closeWarn;
$('warnBack').addEventListener('click', e => { if (e.target === $('warnBack')) closeWarn(); });
addEventListener('keydown', e => { if (e.key === 'Escape' && !$('warnBack').hidden) closeWarn(); });
$('warnOk').onclick = () => { closeWarn(); resetAll(); toast('처음부터 다시 시작해요', '하얀 마당에 베리나무 한 그루만 남았어요'); closeTitle(); };
</script>
